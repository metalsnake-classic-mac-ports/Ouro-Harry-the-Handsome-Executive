[workspace]
resolver = "3"
members = ["crates/harry-core", "crates/harry-data", "crates/harry-original", "crates/harry"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/metalsnake-classic-mac-ports/Ouro-Harry-the-Handsome-Executive"

[workspace.dependencies]
harry-core = { path = "crates/harry-core" }
harry-data = { path = "crates/harry-data" }
anyhow = "1"
sdl3 = "0.20"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ouro-ui = { path = "../ouro-framework/crates/ouro-ui" }
ouro-play = { path = "../ouro-framework/crates/ouro-play" }
